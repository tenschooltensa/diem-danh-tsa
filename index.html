<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Điểm danh TSA — TENSA</title>
<style>
  :root { --brand:#BB2525; --brand-dark:#8A1A1A; --tint:#FDF2F2; --ink:#0F172A; --muted:#4B5565; --line:#E5E7EB; --bg:#F5F5F5; --ok:#15803D; --ok-bg:#ECFDF3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:440px; margin:0 auto; padding:20px 16px 40px; }
  .brand { display:flex; align-items:center; gap:12px; margin:8px 0 16px; }
  .brand img { height:60px; width:auto; display:block; mix-blend-mode:multiply; }
  .brand span { color:var(--muted); font-size:13px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:15px; margin:0 0 10px; }
  p { margin:0; }
  .sub { color:var(--muted); font-size:14px; }
  label { display:block; font-size:14px; font-weight:600; margin:16px 0 6px; }
  input[type=text] { width:100%; height:52px; border:1.5px solid var(--line); border-radius:12px; padding:0 14px; font-size:20px; letter-spacing:1px; text-transform:uppercase; color:var(--ink); background:#fff; }
  input[type=text]:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--tint); }
  .btn { width:100%; height:52px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-size:17px; font-weight:700; margin-top:14px; cursor:pointer; }
  .btn:active { background:var(--brand-dark); }
  .btn[disabled] { opacity:.55; cursor:default; }
  .btn.alt { background:#fff; color:var(--brand); border:1.5px solid var(--brand); }
  .btn.alt:active { background:var(--tint); }
  .link { background:none; border:0; padding:0; color:var(--brand); font-size:14px; font-weight:600; cursor:pointer; }
  .err { color:var(--brand-dark); background:var(--tint); border-radius:10px; padding:10px 12px; font-size:14px; margin-top:12px; }
  .ses { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:10px; font:inherit; color:inherit; }
  button.ses { cursor:pointer; }
  .ses.sel { border-color:var(--brand); background:var(--tint); }
  .ses.off { background:#FAFAFA; color:var(--muted); }
  .ses .t { font-weight:700; }
  .ses .m { font-size:13px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; margin-top:2px; }
  .tag { font-size:12px; font-weight:600; border-radius:999px; padding:1px 9px; white-space:nowrap; }
  .tag.ok { background:var(--ok-bg); color:var(--ok); }
  .tag.wait { background:#F1F5F9; color:var(--muted); }
  .tag.open { background:var(--tint); color:var(--brand); }
  .done { text-align:center; }
  .check { width:56px; height:56px; border-radius:50%; background:var(--ok-bg); color:var(--ok); font-size:30px; line-height:56px; margin:0 auto 8px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .stat { background:var(--bg); border-radius:12px; padding:10px; text-align:center; }
  .stat .n { font-size:24px; font-weight:800; color:var(--brand); }
  .stat .l { font-size:12px; color:var(--muted); }
  .row { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .row:last-child { border-bottom:0; }
  .row.me { font-weight:700; color:var(--brand-dark); }
  .rk { display:inline-block; width:26px; color:var(--muted); font-weight:700; }
  .hide { display:none !important; }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:18px; }
  .wk { display:flex; background:var(--bg); border-radius:10px; padding:3px; margin:0 0 12px; }
  .wk button { flex:1; height:34px; border:0; border-radius:8px; background:none; font:inherit; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; }
  .wk button.on { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(15,23,42,.08); }
  .grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
  @media (max-width:340px) { .grid { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  .cell { border:1px solid var(--line); border-radius:12px; padding:8px; min-height:96px; background:#fff; display:flex; flex-direction:column; gap:4px; }
  .cell.has { background:var(--tint); border-color:#F3D3D3; }
  .cell.today { border:2px solid var(--brand); padding:7px; }
  .cell.past { opacity:.5; }
  .cell .dh { font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap; }
  .cell.today .dh { color:var(--brand); }
  .cell .td { display:inline-block; font-size:10.5px; font-weight:700; color:#fff; background:var(--brand); border-radius:999px; padding:0 7px; align-self:flex-start; }
  .cell .lg { height:26px; width:auto; align-self:flex-start; mix-blend-mode:multiply; }
  .cell .off { font-size:12px; color:#A0A7B4; margin-top:auto; margin-bottom:auto; }
  .cell .ss { font-size:12px; line-height:1.3; }
  .cell .ss b { display:block; font-size:12.5px; color:var(--ink); overflow-wrap:anywhere; }
  .cell .ss span { color:var(--muted); }
  .cell .ss.open b { color:var(--brand); }
  .cell .ss.open span::after { content:' · Đang mở'; color:var(--brand); font-weight:600; }
  .cell .ss.done { opacity:.6; }
</style>
</head>

<script>
  var S = { sbd: '', view: null, pick: '' };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function show(id, on) { $(id).classList.toggle('hide', !on); }
  function err(id, msg) { $(id).textContent = msg || ''; show(id, !!msg); }
  var API = 'https://script.google.com/macros/s/AKfycbxfOBxIaAtLCLcBPWiP5lCeN_-WQwXEC4C_P-4_wXG21Tp2fSWi9zi3MHhyKubKu-6zJA/exec';
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (window.google && google.script && google.script.run) {
      return new Promise(function (res, rej) {
        var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
        r[fn].apply(r, args);
      });
    }
    // Gọi API; nếu Google báo quá tải hoặc mạng chập chờn thì tự thử lại tối đa 4 lần.
    var attempt = 0;
    function go() {
      // Quá 20 giây chưa có phản hồi thì hủy và gửi lại, tránh để học sinh chờ mãi.
      var ctl = window.AbortController ? new AbortController() : null;
      var timer = ctl ? setTimeout(function () { ctl.abort(); }, 20000) : 0;
      return fetch(API, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: args }), signal: ctl ? ctl.signal : undefined
      }).then(function (r) { return r.text(); }).then(function (s) {
        clearTimeout(timer);
        var j;
        try { j = JSON.parse(s); } catch (e) { throw { retry: true }; }
        if (!j.ok) {
          if (/too many|simultaneous|timed out|lock|service/i.test(j.error)) throw { retry: true, msg: j.error };
          throw new Error(j.error);
        }
        return j.data;
      }, function (e) {
        clearTimeout(timer);
        if (e instanceof Error && e.name !== 'AbortError' && e.name !== 'TypeError') throw e;
        throw { retry: true };
      }).catch(function (e) {
        if (e && e.retry && attempt < 5) {
          attempt++;
          return new Promise(function (ok) { setTimeout(ok, 800 * attempt + Math.random() * 1500); }).then(go);
        }
        throw e instanceof Error ? e : new Error('Hệ thống đang đông, em thử lại sau ít giây.');
      });
    }
    return go();
  }
  function store(v) {
    try { if (v === undefined) return localStorage.getItem('tsa_sbd') || ''; localStorage.setItem('tsa_sbd', v); } catch (e) {}
    return '';
  }
  function fmtDate(d) { var p = d.split('-'); return p[2] + '/' + p[1]; }

  function renderSessions() {
    var v = S.view, html = '';
    var open = v.sessions.filter(function (s) { return s.state === 'open' && !s.done; });
    // Buổi đã chọn vừa bị khóa (hoặc đã điểm danh) thì bỏ chọn.
    if (S.pick && !open.some(function (s) { return s.id === S.pick; })) S.pick = '';
    if (!S.pick && open.length === 1) S.pick = open[0].id;
    if (!v.sessions.length) html = '<p class="sub" style="margin-top:14px">Hôm nay chưa có buổi học nào trên thời khóa biểu.</p>';
    v.sessions.forEach(function (s) {
      var can = s.state === 'open' && !s.done;
      var tag = s.done ? '<span class="tag ok">Đã điểm danh</span>'
        : s.state === 'open' ? '<span class="tag open">Đang mở</span>'
        : s.state === 'wait' ? '<span class="tag wait">Chờ thầy/cô mở</span>'
        : '<span class="tag wait">Đã khóa</span>';
      var body = '<div class="t">' + esc(s.subject) + '</div><div class="m"><span>' + esc(s.start) + '–' + esc(s.end)
        + (s.teacher ? ' · ' + esc(s.teacher) : '') + '</span>' + tag + '</div>';
      html += can
        ? '<button type="button" class="ses' + (S.pick === s.id ? ' sel' : '') + '" data-id="' + esc(s.id) + '">' + body + '</button>'
        : '<div class="ses off">' + body + '</div>';
    });
    $('list').innerHTML = html;
    show('b2', open.length > 0);
    var waiting = v.sessions.some(function (s) { return s.state === 'wait' && !s.done; });
    if (!open.length && v.sessions.length) {
      $('list').insertAdjacentHTML('beforeend', waiting
        ? '<p class="sub" style="margin-top:12px">Buổi học chưa được mở điểm danh. Khi vào học, thầy/cô sẽ gửi link điểm danh, em mở link hoặc bấm “Kiểm tra lại”.</p>'
        : '<p class="sub" style="margin-top:12px">Hiện không có buổi nào đang mở điểm danh.</p>');
    }
    show('b3', !open.length && waiting);
  }

  function renderStats() {
    var v = S.view;
    $('nTotal').textContent = v.total;
    $('nRank').textContent = v.myRank ? '#' + v.myRank : '–';
    $('top').innerHTML = v.top.length ? v.top.map(function (t) {
      return '<div class="row' + (t.me ? ' me' : '') + '"><span><span class="rk">' + t.rank + '</span>' + esc(t.name) + (t.me ? ' (em)' : '')
        + '</span><span>' + t.count + ' buổi</span></div>';
    }).join('') : '<p class="sub">Chưa có lượt điểm danh nào.</p>';
    $('hist').innerHTML = v.history.length ? v.history.map(function (h) {
      return '<div class="row"><span>' + fmtDate(h.date) + ' · ' + esc(h.subject) + '</span><span class="tag ok">' + esc(h.at) + '</span></div>';
    }).join('') : '<p class="sub">Em chưa điểm danh buổi nào.</p>';
    show('statsBox', true);
  }

  function toStep1() {
    S.view = null; S.pick = '';
    show('s1', true); show('sched', true); show('s2', false); show('s3', false); show('statsBox', false);
    err('e1', ''); $('sbd').focus();
  }

  $('f1').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var sbd = $('sbd').value.replace(/\s+/g, '').toUpperCase();
    if (!sbd) { err('e1', 'Nhập số báo danh của em.'); return; }
    err('e1', ''); $('b1').disabled = true; $('b1').textContent = 'Đang kiểm tra…';
    call('lookupStudent', sbd).then(function (v) {
      if (!v.ok) { err('e1', v.msg); return; }
      S.sbd = v.sbd; S.view = v; S.pick = ''; store(v.sbd);
      $('hello').textContent = v.name; $('hsbd').textContent = 'SBD ' + v.sbd;
      show('s1', false); show('sched', false); show('s2', true); show('s3', false); err('e2', '');
      renderSessions(); renderStats(); planRefresh();
    }).catch(function (e) {
      err('e1', friendly(e, 'Không kết nối được. Kiểm tra mạng rồi thử lại.'));
    }).then(function () { $('b1').disabled = false; $('b1').textContent = 'Tiếp tục'; });
  });

  $('list').addEventListener('click', function (ev) {
    var b = ev.target.closest('button.ses');
    if (!b) return;
    S.pick = b.getAttribute('data-id'); err('e2', ''); renderSessions();
  });

  $('b2').addEventListener('click', function () {
    if (!S.pick) { err('e2', 'Chọn buổi học em đang tham gia.'); return; }
    err('e2', ''); $('b2').disabled = true; $('b2').textContent = 'Đang ghi nhận…';
    call('checkIn', S.sbd, S.pick).then(function (v) {
      // Bị từ chối (thường do thầy/cô vừa khóa): tải lại danh sách buổi để thấy trạng thái mới, giữ nguyên thông báo.
      if (!v.ok) { S.pick = ''; return refreshView(null).then(function () { err('e2', v.msg); }); }
      S.view = v; S.pick = '';
      $('dTitle').textContent = v.checked.already ? 'Em đã điểm danh buổi này rồi' : 'Đã điểm danh';
      $('dSub').textContent = v.checked.subject + ' · ' + v.checked.at;
      show('s3', true); renderSessions(); renderStats(); planRefresh();
      window.scrollTo(0, 0);
    }).catch(function (e) {
      err('e2', friendly(e, 'Không ghi nhận được. Kiểm tra mạng rồi thử lại.'));
    }).then(function () { $('b2').disabled = false; $('b2').textContent = 'Điểm danh'; });
  });

  /** Thông báo lỗi dễ hiểu: lỗi từ hệ thống thì hiện đúng nội dung, lỗi mạng thì hiện câu mặc định. */
  function friendly(e, fallback) {
    var m = e && e.message ? String(e.message) : '';
    return m && !/failed to fetch|network|load failed|abort/i.test(m) ? m : fallback;
  }

  // Điểm danh chỉ mở khi thầy/cô bật, nên trang không tự hỏi lại liên tục (1.000 bạn cùng chờ sẽ làm nghẽn hệ thống).
  // Thay vào đó: bấm "Kiểm tra lại", hoặc khi em quay lại trang này (ví dụ sau khi đọc tin nhắn của thầy/cô trong Zalo)
  // thì trang tự kiểm tra, tối đa 1 lần mỗi 15 giây.
  var lastRefresh = 0;
  function planRefresh() { lastRefresh = Date.now(); }
  function refreshView(btn) {
    if ($('s2').classList.contains('hide') || !S.sbd) return Promise.resolve();
    lastRefresh = Date.now();
    if (btn) { btn.disabled = true; btn.textContent = 'Đang kiểm tra…'; }
    return call('lookupStudent', S.sbd).then(function (nv) {
      if (!nv.ok || $('s2').classList.contains('hide')) return;
      S.view = nv; err('e2', ''); renderSessions(); renderStats();
    }).catch(function (e) {
      if (btn) err('e2', friendly(e, 'Không kết nối được. Kiểm tra mạng rồi thử lại.'));
    }).then(function () { if (btn) { btn.disabled = false; btn.textContent = 'Kiểm tra lại'; } });
  }
  $('b3').addEventListener('click', function () { refreshView($('b3')); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !S.view || Date.now() - lastRefresh < 15000) return;
    var pending = S.view.sessions.some(function (s) { return !s.done && (s.state === 'wait' || s.state === 'open'); });
    if (pending) refreshView(null);
  });

  $('change').addEventListener('click', function () { $('sbd').value = ''; store(''); toStep1(); });
  $('sbd').value = store();

  // ---- Lịch học tuần ----
  var DSHORT = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  var LOGO = (document.querySelector('.brand img') || {}).src || '';
  var schedCache = {};   // { off: { at: thời điểm tải, w: dữ liệu } }, dùng lại trong 5 phút
  function addDay(d, n) { var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
  function renderSched(w) {
    var p1 = w.mon.split('-'), p2 = w.sun.split('-');
    $('wkLabel').textContent = p1[2] + '/' + p1[1] + ' – ' + p2[2] + '/' + p2[1] + '/' + p2[0]
      + (w.list.length ? '' : (w.off ? ' · Tuần sau chưa có lịch học, lịch được cập nhật hằng tuần.' : ' · Tuần này chưa có lịch học.'));
    var byDay = {};
    w.list.forEach(function (s) { (byDay[s.date] = byDay[s.date] || []).push(s); });
    var html = '<div class="grid">';
    for (var i = 0; i < 7; i++) {
      var d = addDay(w.mon, i), list = byDay[d] || [];
      var isToday = d === w.today, isPast = d < w.today;
      html += '<div class="cell' + (list.length ? ' has' : '') + (isToday ? ' today' : '') + (isPast ? ' past' : '') + '">'
        + '<div class="dh">' + DSHORT[new Date(d + 'T00:00:00Z').getUTCDay()] + ' ' + fmtDate(d) + '</div>' + (isToday ? '<span class="td">Hôm nay</span>' : '');
      if (!list.length) {
        html += '<div class="off">Nghỉ</div>';
      } else {
        if (LOGO) html += '<img class="lg" alt="TENSA" src="' + LOGO + '">';
        list.forEach(function (s) {
          var tip = s.subject + ' · ' + s.start + '–' + s.end + (s.teacher ? ' · ' + s.teacher : '') + (s.note ? ' · ' + s.note : '');
          html += '<div class="ss' + (s.state === 'open' ? ' open' : '') + ((s.state === 'closed' || s.state === 'ended') && !isPast ? ' done' : '') + '" title="' + esc(tip) + '">'
            + '<b>' + esc(s.subject) + '</b><span>' + esc(s.start) + (s.teacher ? ' · ' + esc(s.teacher) : '') + '</span></div>';
        });
      }
      html += '</div>';
    }
    $('schedList').innerHTML = html + '</div>';
  }
  function loadSched(off) {
    $('wk0').classList.toggle('on', off === 0);
    $('wk1').classList.toggle('on', off === 1);
    var c = schedCache[off];
    if (c && Date.now() - c.at < 5 * 60 * 1000) { renderSched(c.w); return; }
    $('schedList').innerHTML = '<p class="sub">Đang tải lịch học…</p>';
    call('getSchedule', off).then(function (w) {
      schedCache[off] = { at: Date.now(), w: w };
      if ($('wk' + off).classList.contains('on')) renderSched(w);
    }).catch(function () {
      $('schedList').innerHTML = '<p class="sub">Chưa tải được lịch học. Tải lại trang để thử lại.</p>';
    });
  }
  $('wk0').addEventListener('click', function () { loadSched(0); });
  $('wk1').addEventListener('click', function () { loadSched(1); });
  loadSched(0);
</script>
</body>
</html>
